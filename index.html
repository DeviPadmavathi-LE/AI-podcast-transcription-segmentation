<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALK2TOPICS | AI Podcast Intelligence & Chapter Discovery</title>
    
    <!-- Navayr Luxury & Tech Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Talkie Mascot Global Container -->
    <div id="talkie-mascot" class="talkie-container hidden">
        <svg id="talkie-svg" viewBox="0 0 100 100" class="talkie-idle">
            <!-- Adaptive cute robot face -->
            <rect x="20" y="30" width="60" height="40" rx="12" fill="var(--robot-body)" stroke="var(--border-color)" stroke-width="1.5" />
            <rect x="25" y="35" width="50" height="30" rx="8" fill="var(--robot-face)" />
            <circle cx="40" cy="50" r="4" fill="var(--robot-eye)" class="talkie-eye left-eye" />
            <circle cx="60" cy="50" r="4" fill="var(--robot-eye)" class="talkie-eye right-eye" />
            <path d="M45,60 Q50,62 55,60" stroke="var(--robot-eye)" stroke-width="2" fill="none" class="talkie-mouth" />
            <line x1="50" y1="30" x2="50" y2="20" stroke="var(--robot-body)" stroke-width="3" />
            <circle cx="50" cy="18" r="3.5" fill="var(--robot-accent)" class="talkie-antenna" />
        </svg>
        <div id="talkie-bubble" class="talkie-bubble hidden">Hi! I'm Talkie.</div>
    </div>

    <!-- App Shell -->
    <div id="app" class="app-layout">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <i data-lucide="layers" class="brand-icon"></i>
                <span class="brand-name">TALK2TOPICS</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#dashboard" class="nav-link" data-route="dashboard">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </a>
                <a href="#upload" class="nav-link" data-route="upload">
                    <i data-lucide="upload-cloud"></i> Upload
                </a>
                <a href="#library" class="nav-link" data-route="library">
                    <i data-lucide="library"></i> Library
                </a>
                
                <div class="nav-section">Insights</div>
                
                <a href="#transcript" class="nav-link" data-route="transcript">
                    <i data-lucide="file-text"></i> Transcripts
                </a>
                <a href="#topics" class="nav-link" data-route="topics">
                    <i data-lucide="hash"></i> Topic Explorer
                </a>
                <a href="#summary" class="nav-link" data-route="summary">
                    <i data-lucide="zap"></i> AI Summary
                </a>
                <a href="#keywords" class="nav-link" data-route="keywords">
                    <i data-lucide="bar-chart-2"></i> Keywords & Analytics
                </a>

                <div class="nav-section">Advanced</div>

                <a href="#chat" class="nav-link" data-route="chat">
                    <i data-lucide="message-square"></i> AI Chat
                </a>
                <a href="#translation" class="nav-link" data-route="translation">
                    <i data-lucide="globe"></i> Translation
                </a>
                <a href="#romanization" class="nav-link" data-route="romanization">
                    <i data-lucide="type"></i> Romanization
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="#settings" class="nav-link" data-route="settings">
                    <i data-lucide="settings"></i> Settings
                </a>
                <a href="#help" class="nav-link" data-route="help">
                    <i data-lucide="help-circle"></i> Help
                </a>
                <div class="made-with">
                    Made with <i data-lucide="heart" class="heart-icon"></i>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- Global Header -->
            <header class="top-header">
                <div class="header-left">
                    <button id="menu-toggle-btn" class="icon-btn menu-toggle-btn" aria-label="Toggle Navigation" title="Toggle Sidebar">
                        <i data-lucide="menu"></i>
                    </button>
                    <div class="search-container">
                        <i data-lucide="search" class="search-icon"></i>
                        <input type="text" id="global-search" placeholder="Search transcripts, topics, insights...">
                    </div>
                </div>
                
                <div class="header-actions">
                    <!-- Navayr Theme Switcher: Light (Creme & Burgundy) / Dark (Obsidian Black) -->
                    <button id="theme-toggle-btn" class="theme-toggle-pill" aria-label="Switch Theme" title="Toggle Light / Dark Theme">
                        <span class="theme-pill-icon light-icon" title="Creme & Burgundy">
                            <i data-lucide="sun" width="14" height="14"></i>
                        </span>
                        <span class="theme-pill-icon dark-icon" title="Obsidian Black">
                            <i data-lucide="moon" width="14" height="14"></i>
                        </span>
                        <span class="theme-pill-slider"></span>
                    </button>

                    <button class="btn-outline export-btn" onclick="app.showExportModal()">
                        <i data-lucide="download"></i> Export
                    </button>
                    <div class="avatar-circle">
                        <i data-lucide="user"></i>
                    </div>
                </div>
            </header>

            <!-- Dynamic Route Content -->
            <div id="route-content" class="route-container">
                <!-- Views will be injected here by app.js -->
            </div>
            
        </main>
    </div>

    <!-- Export Modal -->
    <div id="export-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Export Center</h2>
                <button class="icon-btn" onclick="app.hideExportModal()"><i data-lucide="x"></i></button>
            </div>
            <p style="font-size:0.875rem;color:var(--text-secondary);margin-bottom:1rem;">
                Download your podcast data in any of these formats.
            </p>
            <div class="export-grid">
                <button class="export-card" onclick="app.download('txt')">
                    <i data-lucide="file-type"></i> TXT
                </button>
                <button class="export-card" onclick="app.download('json')">
                    <i data-lucide="database"></i> JSON
                </button>
                <button class="export-card" onclick="app.download('srt')">
                    <i data-lucide="film"></i> SRT Subtitles
                </button>
                <button class="export-card" onclick="app.download('md')">
                    <i data-lucide="file-code"></i> Markdown
                </button>
                <button class="export-card" onclick="app.download('csv')">
                    <i data-lucide="table"></i> CSV
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/api.js"></script>
    <script src="assets/js/mascot.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
